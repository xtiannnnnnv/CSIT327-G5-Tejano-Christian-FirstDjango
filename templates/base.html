<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}CampusConnect{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        :root {
            --bs-primary: #495057;
            --bs-primary-rgb: 73, 80, 87;
            --bs-link-color: #495057;
            --bs-link-hover-color: #343a40;
        }

        .btn-primary {
            --bs-btn-bg: #495057;
            --bs-btn-border-color: #495057;
            --bs-btn-hover-bg: #343a40;
            --bs-btn-hover-border-color: #343a40;
            --bs-btn-active-bg: #212529;
            --bs-btn-active-border-color: #212529;
            --bs-btn-disabled-bg: #495057;
            --bs-btn-disabled-border-color: #495057;
        }

        .btn-outline-primary {
            --bs-btn-color: #495057;
            --bs-btn-border-color: #495057;
            --bs-btn-hover-bg: #495057;
            --bs-btn-hover-border-color: #495057;
            --bs-btn-active-bg: #343a40;
            --bs-btn-active-border-color: #343a40;
        }

        .navbar.bg-primary {
            background-color: #495057 !important;
        }
    </style>
</head>
<body class="bg-body-tertiary d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="{% url 'dashboard' %}">CampusConnect</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <div class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
                    {% if user.is_authenticated %}
                        <span class="navbar-text text-white">Hi, {{ user.username }}!</span>
                        <a class="nav-link" href="{% url 'profile' %}">Edit profile</a>
                        <form method="post" action="{% url 'logout' %}" class="d-inline">
                            {% csrf_token %}
                            <button class="btn btn-outline-light btn-sm" type="submit">Log out</button>
                        </form>
                    {% else %}
                        <a class="nav-link" href="{% url 'login' %}">Log in</a>
                        <a class="btn btn-light btn-sm" href="{% url 'signup' %}">Sign up</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>
    <main class="container py-4 flex-grow-1">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags|default:'info' }}{% endif %} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </main>
    <footer class="border-top bg-white py-3">
        <div class="container text-center text-body-secondary small">Copyright by CITU</div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
