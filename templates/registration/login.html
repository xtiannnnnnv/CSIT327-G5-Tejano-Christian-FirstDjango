{% extends "base.html" %}

{% block title %}CampusConnect - Log In{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <h1 class="h3 mb-4">Log in</h1>
                {% if form.errors %}
                    <div class="alert alert-danger" role="alert">Your username or password was incorrect. Please try again.</div>
                {% endif %}
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label" for="{{ form.username.id_for_label }}">{{ form.username.label }}</label>
                        <input class="form-control" type="text" name="{{ form.username.html_name }}" id="{{ form.username.id_for_label }}" value="{{ form.username.value|default_if_none:'' }}" autocomplete="username" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="{{ form.password.id_for_label }}">{{ form.password.label }}</label>
                        <input class="form-control" type="password" name="{{ form.password.html_name }}" id="{{ form.password.id_for_label }}" autocomplete="current-password" required>
                    </div>
                    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
                    <button class="btn btn-primary" type="submit">Log in</button>
                </form>
                <p class="mt-3 mb-0">No account? <a href="{% url 'signup' %}">Sign up</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
